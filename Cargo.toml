[workspace]
members = [
  "crates/mice-ipc",
  "crates/mice-providers",
  "crates/mice-core",
  "crates/mice-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "MICE is a privacy-first terminal/TUI sidekick sub-agent for coding LLMs, offloading token-heavy routines like AST search, code patching, local test runs, and semantic document retrieval."
keywords = ["ai", "agent", "sidekick", "tui", "coding", "subagent", "rust"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
sha2 = "0.10"
